name: "miraAi"

services:
  postgres-db:
    image: postgres:18.7
    shm_size: 128mb
    env_file:
      - ./.postgre.env
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5000:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  mira-fastapi-server:
    image: mira-fastapi-backend:latest
    platform: linux/arm64
    pull_policy: never
    env_file:
      - ./Backend/FastApi-Backend/.docker.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres-data:
