[project]
name = "text-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shakir Gamzaev", email = "shkir100@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "boto3[crt]>=1.44.12",
    "openai-agents>=0.26.0",
    "pydantic>=2,<3",
]

[project.scripts]
text-agent = "text_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs-lite[secretsmanager]==1.44.12",
]
